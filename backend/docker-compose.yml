services:
  postgres:
    image: postgres:16-alpine
    container_name: hrm-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hrm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrm-backend
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/hrm?schema=public&connection_limit=15&pool_timeout=10
      - DIRECT_URL=postgresql://postgres:postgrespassword@postgres:5432/hrm?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
